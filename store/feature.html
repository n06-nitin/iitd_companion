<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage";src:url(bricolage_grotesque.ttf);font-weight:200 800}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:#141518;color:#ECE7DE;font-family:"Bricolage",system-ui,sans-serif;position:relative}
.light{position:absolute;inset:0;background:radial-gradient(900px 500px at 20% 0%,rgba(255,255,255,.05),transparent 70%)}
.copy{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:18px;width:520px}
h1{margin:0;font-size:68px;line-height:1;font-weight:800;font-variation-settings:"opsz" 72;letter-spacing:-.01em}
p{margin:0;font-size:26px;line-height:1.3;color:#9A968E;font-variation-settings:"opsz" 24;font-weight:500}
.clay{background:linear-gradient(180deg,#2A2C33,#1F2126);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.35),10px 16px 30px rgba(0,0,0,.6),-6px -6px 18px rgba(255,255,255,.03)}
.dock{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:340px;padding:12px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;font-size:24px;font-weight:600}
.row i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.row.on{color:#141518;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),6px 10px 18px rgba(0,0,0,.5)}
.row.on i{background:#141518 !important;box-shadow:none}
.row small{margin-left:auto;font-size:15px;font-weight:500;opacity:.7}
</style></head><body><div class="light"></div>
<div class="copy">
  <h1>IITD Companion</h1>
  <p>Webmail, Moodle New, Moodle and RollCall in one app, with one saved login.</p>
</div>
<div class="dock clay">
  <div class="row"><i style="background:#6FA6F2"></i>Webmail<small>signs in itself</small></div>
  <div class="row on" style="background:#4FC1AE"><i></i>Moodle New<small>signs in itself</small></div>
  <div class="row"><i style="background:#F0913A"></i>Moodle<small>you type the CAPTCHA</small></div>
  <div class="row"><i style="background:#7CCB6E"></i>RollCall<small>Mark · Verify</small></div>
</div>
</body></html>
