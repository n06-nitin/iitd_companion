<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage";src:url(bricolage_grotesque.ttf);font-weight:200 800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#141518;color:#ECE7DE;font-family:"Bricolage",system-ui,sans-serif;position:relative}
.light{position:absolute;inset:0;background:radial-gradient(1100px 700px at 25% 0%,rgba(255,255,255,.05),transparent 70%)}
.cap{position:absolute;left:84px;right:84px;top:108px;display:grid;gap:18px}
.dot{width:18px;height:18px;border-radius:50%;background:#7CCB6E;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
h1{margin:0;font-size:76px;line-height:1.02;font-weight:800;font-variation-settings:"opsz" 72;letter-spacing:-.01em;text-wrap:balance}
p{margin:0;font-size:36px;line-height:1.3;color:#9A968E;font-weight:500;font-variation-settings:"opsz" 24;text-wrap:balance}
.phone{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);width:640px;height:1422px;border-radius:58px;padding:14px;
  background:linear-gradient(180deg,#2C2F36,#1C1D22);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),20px 30px 60px rgba(0,0,0,.65),-10px -10px 30px rgba(255,255,255,.03)}
.phone img{width:640px;height:1422px;border-radius:46px;display:block;object-fit:cover;object-position:top}
</style></head><body><div class="light"></div>
<div class="cap"><div class="dot"></div><h1>RollCall, ready to mark</h1><p>Pick a course, then Mark or Verify in one tap.</p></div>
<div class="phone"><img src="raw-rollcall.png"></div>
</body></html>
