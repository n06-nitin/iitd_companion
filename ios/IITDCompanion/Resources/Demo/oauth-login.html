<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IITD OAuth</title>
<link rel="stylesheet" href="/_demo/demo.css">
<style>:root{--accent:#7a1f2b}.login{max-width:400px;margin:40px auto 0;padding:0 16px}.logo{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px}.captcha-image{display:block;width:180px;height:60px;margin:4px 0 2px;border:1px solid #ced4da;border-radius:8px}</style>
</head><body>
<div class="demo-banner">Demo mode · sample data, nothing is sent to IIT Delhi</div>
<div class="login">
  <div class="logo">IIT Delhi Single Sign-On</div>
  <p class="muted" style="text-align:center;margin-top:0">Sign in to continue to RollCall</p>
  <div class="card">
    {{ERROR}}
    <form method="get" action="/authorize.php">
      <input type="hidden" name="client_id" value="rollcall">
      <label for="username">Kerberos ID</label>
      <input type="text" name="username" id="username" autocapitalize="off" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="current-password">
      <label for="captcha_code">Security code</label>
      <img class="captcha-image" src="/_demo/rollcall-captcha.svg" alt="Security code">
      <div class="muted" style="margin-bottom:8px">Type the characters shown above</div>
      <input type="text" name="ct_captcha" id="captcha_code" autocapitalize="characters" autocomplete="off">
      <p><button type="submit" class="btn" style="width:100%">Login</button></p>
    </form>
  </div>
</div>
</body></html>
