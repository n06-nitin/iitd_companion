<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClassGrid</title>
<link rel="stylesheet" href="/_demo/demo.css">
<style>
:root{--accent:#c2457f}
.day{display:flex;gap:12px;align-items:flex-start}
.day .d{width:56px;flex:none;font-weight:700}
.day .d span{display:block;font-weight:400;font-size:12px;color:#6a737b}
.slot{border-left:3px solid var(--accent);background:#fbeef4;border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:14px}
.slot b{display:block}
.note{font-size:12px;color:#a3366a;margin-bottom:6px}
</style>
</head><body>
<div class="demo-banner">Demo mode · sample data, nothing is sent to DevClub</div>
<div class="topbar"><span class="brand">ClassGrid</span><span style="font-size:14px">Calendar</span></div>
<div class="wrap" id="app"></div>
<script>
var WEEK=[
 ['Mon','2 Nov',[['MCL211','08:00–09:00','LH 108'],['COL106','11:00–12:00','LH 121']]],
 ['Tue','3 Nov',[['MCL134','09:30–11:00','LH 310'],['HUL261','17:00–18:30','LH 527']]],
 ['Wed','4 Nov',[['MCL211','08:00–09:00','LH 108'],['COL106','11:00–12:00','LH 121']],'Friday timetable'],
 ['Thu','5 Nov',[['MCL134','09:30–11:00','LH 310'],['HUL261','17:00–18:30','LH 527']]],
 ['Fri','6 Nov',[['MCL211','08:00–09:00','LH 108'],['COL106','11:00–12:00','LH 121']]]
];
document.getElementById('app').innerHTML='<div class="card"><h2>This week</h2>'+WEEK.map(function(w){
  return '<div class="day"><div class="d">'+w[0]+'<span>'+w[1]+'</span></div><div style="flex:1">'
    +(w[3]?'<div class="note">'+w[3]+'</div>':'')
    +w[2].map(function(s){return '<div class="slot"><b>'+s[0]+'</b>'+s[1]+' · '+s[2]+'</div>'}).join('')+'</div></div>';
}).join('')+'</div><p class="muted">Add the timetable to Google Calendar or Apple Calendar from the full site.</p>';
</script>
</body></html>
