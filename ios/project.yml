name: IITDCompanion
options:
  bundleIdPrefix: com.xlonlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  IITDCompanion:
    type: application
    platform: iOS
    sources:
      - path: IITDCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xlonlabs.iitdcompanion
        PRODUCT_NAME: IITDCompanion
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 32G25Q7ZYP
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: IITDCompanion/Info.plist
      properties:
        CFBundleDisplayName: IITD Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBg
        UIAppFonts:
          - BricolageGrotesque.ttf
        NSCameraUsageDescription: RollCall's QR scanner uses the camera to mark your attendance.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
